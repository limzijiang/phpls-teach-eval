<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PHPLS 示範教學評分</title>
<style>
:root{
  --red:#990011; --red-d:#6d000c; --cream:#FCF6F5; --gold:#C89211;
  --ink:#2a1a1c; --mute:#7a6668; --line:#ead9d6; --card:#fff;
  --ok:#1f7a4d; --warn:#b86e00; --bad:#b3122a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--red);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.5px}
header .kick{color:var(--gold);font-weight:700;font-size:12px;display:block;letter-spacing:1px}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:10px 4px;font-size:15px;color:var(--mute);border-bottom:3px solid transparent}
nav button.on{color:var(--red);border-color:var(--red);font-weight:700}
main{max-width:760px;margin:0 auto;padding:12px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.kicker{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:1px;margin-bottom:4px}
label.f{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
select,input[type=text],input[type=password],textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:70px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.hint{font-size:13px;color:var(--mute)}
.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--red);color:#fff;font-weight:600}
.btn.sec{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.gold{background:var(--gold)}
.btn:disabled{opacity:.45}
.hidden{display:none!important}
/* recorder */
.rec{text-align:center}
.timer{font:700 60px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:2px;margin:6px 0 4px;color:var(--mute)}
.timer.z1{color:var(--warn)}.timer.z2{color:var(--ok)}.timer.z3{color:var(--warn)}.timer.z4{color:var(--bad)}
.zoneText{font-size:14px;min-height:21px;color:var(--mute)}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#ddd 0 78.6%,#f1d9a8 78.6% 85.7%,#bfe3cf 85.7% 100%);position:relative;margin:10px 0 18px;overflow:visible}
.bar i{position:absolute;top:-4px;width:3px;height:18px;background:var(--red);border-radius:2px;left:0}
.bar b{position:absolute;top:13px;font-size:11px;color:var(--mute);transform:translateX(-50%);font-weight:400}
.level{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:10px auto 0;max-width:260px}
.level i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.recBtn{width:110px;height:110px;border-radius:50%;border:6px solid #f3d6d9;background:var(--red);color:#fff;font-size:20px;font-weight:700;margin:8px auto 4px;display:block}
.recBtn.on{background:#fff;color:var(--red);border-color:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(153,0,17,.12)}}
.flash{animation:flash .6s 3}@keyframes flash{50%{background:#ffe9a8}}
main.wide{max-width:1440px}
.topbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.panels{grid-template-columns:1fr}}
.panel{min-width:0;border-top:5px solid var(--line);border-radius:14px;padding-top:8px;display:flex;flex-direction:column}
.panel>*{flex:none}.ptitle{order:-3}.panel .q-prog{order:-2}.panel .q-result{order:-1}
@media (min-width:901px){.panels{height:calc(100vh - 190px)}.panel{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}.ptitle{position:sticky;top:0;background:var(--cream);z-index:2;padding:4px 0}}
.panel.recording{border-color:var(--red)}.panel.busy{border-color:var(--gold)}.panel.review{border-color:var(--ok)}
.ptitle{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
.ptitle b{font-size:18px;color:var(--red)}
.pstate{font-size:13px;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel.recording .pstate{color:#fff;background:var(--red);border-color:var(--red)}
.panel.busy .pstate{color:#fff;background:var(--gold);border-color:var(--gold)}
.panel.review .pstate{color:#fff;background:var(--ok);border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:14px;color:var(--ink)}
.chip.neg{border-color:#f0c4ca;color:var(--bad)}
.chip:active{background:#fbe7ea}
#markLog{font-size:13px;color:var(--mute);margin-top:6px}
.tx{font-size:14px;max-height:260px;overflow:auto;background:#fffdfc;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tx p{margin:0 0 6px}.tx .t{color:var(--gold);font-weight:700;font-family:ui-monospace,Menlo,monospace;margin-right:6px;cursor:pointer}
.tx .m{color:var(--red)}
.pending{color:var(--mute);font-style:italic}
/* result */
.score-grid{display:grid;grid-template-columns:1fr;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px}
.item h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.item h4>span:first-child{flex:1}
.seg{display:inline-flex;border:1px solid var(--red);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--red);width:38px;height:34px;font-weight:700;font-size:16px}
.seg button.on{background:var(--red);color:#fff}
.item .why{font-size:14px;margin:4px 0 0}
.ev{font-size:13px;color:var(--mute);margin:4px 0 0;padding-left:0;list-style:none}
.ev li{margin-top:2px}.ev .t{color:var(--gold);font-weight:700;font-family:ui-monospace,Menlo,monospace;cursor:pointer}
.ai{font-size:12px;color:var(--mute)}
.total{display:flex;align-items:baseline;gap:10px;justify-content:center;margin:6px 0}
.total b{font-size:44px;color:var(--red)}
.fb h5{margin:10px 0 2px;font-size:14px;color:var(--red)}
.fb ul{margin:0;padding-left:20px;font-size:15px}
.issue{background:#fff3f4;border-left:4px solid var(--bad);padding:6px 10px;border-radius:6px;margin:6px 0;font-size:14px}
.pearl{background:#fbf6e8;border-left:4px solid var(--gold);padding:6px 10px;border-radius:6px;margin:6px 0;font-size:14px}
.steps{font-size:14px;color:var(--mute)}
.steps div{margin:3px 0}.steps .done{color:var(--ok)}.steps .run{color:var(--red);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}
td.n{text-align:center;font-family:ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.95}
audio{width:100%;margin-top:8px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:#f6e9e7;color:var(--red-d);margin-left:4px}
</style>
</head>
<body>
<header>
  <h1><span class="kick">PHPLS INSTRUCTOR ・ 北區場</span>示範教學 AI 評分</h1>
  <button id="setBtn">設定</button>
</header>
<nav>
  <button data-tab="rec" class="on">錄音評分</button>
  <button data-tab="hist">本站紀錄</button>
</nav>
<main>

<!-- ============ 錄音評分 ============ -->
<section id="tab-rec">
  <div class="card topbar">
    <div style="flex:1;min-width:0"><label class="f" style="margin-top:0">站別（兩台共用）</label><select id="station"></select></div>
    <div id="keyWarn" class="hint hidden" style="color:var(--bad)">尚未設定 OpenAI API key → 按右上「設定」</div>
  </div>
  <div class="panels" id="panels"></div>
</section>

<!-- ============ 紀錄 ============ -->
<section id="tab-hist" class="hidden">
  <div class="card">
    <div class="kicker">已儲存的評分</div>
    <div class="row" style="margin-bottom:8px">
      <select id="histFilter"></select>
    </div>
    <div style="overflow-x:auto"><table id="histTable"></table></div>
    <div class="row" style="margin-top:10px">
      <button class="btn sec" id="csvBtn">匯出 CSV</button>
      <button class="btn sec" id="copyAllBtn">複製本站全部</button>
    </div>
  </div>
</section>

<!-- ============ 設定 ============ -->
<section id="tab-set" class="hidden">
  <div class="card">
    <div class="kicker">OpenAI API</div>
    <label class="f">API key（只存在這台裝置的瀏覽器）</label>
    <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
    <div class="row">
      <div><label class="f">轉錄模型</label><input type="text" id="mTx"></div>
      <div><label class="f">評分模型</label><input type="text" id="mScore"></div>
    </div>
    <label class="f">評分者</label><input type="text" id="rater" placeholder="例：林自強">
    <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="beep"> 6:00／7:00／7:30 發出提示音（預設只震動＋閃爍）</label>
  </div>
  <div class="card">
    <div class="kicker">學員名單</div>
    <div class="hint">一行一位：「編號 姓名」，例如 <code>C6 黃晏博</code>。名單只存在本機。</div>
    <textarea id="rosterIn" style="min-height:160px"></textarea>
  </div>
  <div class="row"><button class="btn" id="saveSet">儲存設定</button><button class="btn sec" id="closeSet">返回</button></div>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
/* ================= 課程資料（115 北區場評分單、示範教學準備說明） ================= */
const RUBRIC = `① 內容正確性：3＝在時間內仍可補充教材外的相關實務知識或技巧；2＝正確；1＝不正確
② 學員互動：3＝互動熱烈且願意給予其他學員回饋；2＝有互動，程度普通；無建樹的回饋（只說「很棒」而無具體內容）；1＝無互動
③ 教學方法與技巧：3＝在時間內善用 4D 教學、全動操作或其他優異教學方法；2＝中規中矩；1＝運用不佳，如操作課程僅上 PPT
④ 口語、儀態與器材：3＝口齒清晰、台風穩健、善用器材；2＝能清楚表達；1＝過於小聲或講課時學員難以分辨表達內容
⑤ 時間控制：3＝6:00–7:00；2＝7:00–7:30 或 5:30–6:00；1＝>7:30（強制下台）或 <5:30`;

const FLOW = {
  lecture:`大堂授課：同組 5 人把同一堂課拆成 5 段接力（抽籤決定段別），以公告 PPT 為主、可自行增加補充教材。每人 7 分鐘，結束前 1 分鐘提示，之後 2 分鐘回饋講評。教學一律採互動式；段與段要銜接得上。`,
  skill:`技術站：每人 7 分鐘，建議節奏 0:00–1:00 Describe（這段做什麼、為什麼重要、品質指標，一句話講完學習目標）→ 1:00–3:00 Demo（邊做邊講關鍵步驟，放慢、關鍵動作停一拍）→ 3:00–5:15 Do（讓 1–2 位學員實際操作，錯了當下修正）→ 5:15–6:30 Debrief（先請操作者自評，再補充，最後一句帶得走的重點）。不建議投影片/影片；技術課只放 PPT 會被判定「教學法運用不佳」。可請同組一位學員擔任助教。`,
  scenario:`情境站：評的是「怎麼帶一個 case」，不是會不會急救。建議節奏 0:00–0:30 設定（一句話交代情境、環境、角色分派）→ 0:30–3:30 推進（給生命徵象與現場線索，讓學員實際處置；需要時暫停引導再繼續）→ 3:30–5:30 Debrief（先問學員感受與觀察 → 分析為什麼 → 收斂成原則，不是逐項糾錯）→ 5:30–6:30 收尾（回到 Critical error 與 2–3 個 key point，講出帶得走的結論）。6–7 分鐘只夠帶 2–3 個重點；情境要合情合理（年齡、體重、生命徵象、到院時間互相對得上）；指導員自己講超過一半時間就失分。`
};
const PLUS_MINUS = `看得到的好：開場 30 秒內講清楚學習目標；示範放慢、關鍵處停一拍、講「為什麼」；真的讓學員動手、錯誤當場修正；時間內補得上教材外的實務經驗（這是內容 3 分的門檻）；回饋具體且對事；藥物與能量一律依體重當場計算；收在 6–7 分鐘。
常見扣分：從頭講到尾，沒有 Demo、沒有 Do；操作課只上 PPT；示範太久 debrief 被吃掉；回饋只說「很棒」；套用成人劑量或成人做法；情境數值與年齡兜不起來；器材沒先確認、上台才找東西。
參考教材順序（內容衝突時依此為準）：2025 AHA 兒童急救指引（PBLS、PALS、NRP）＞ 高級救護技術員教科書（第三版）＞ PALS 和 APLS 精華（第三版）。`;

const STATIONS = [
 {id:'L1',kind:'lecture',name:'大堂授課　小兒基本救命術心跳停止與團隊急救',room:'4A019',groups:['A1-5','A6-10'],parts:[
  ['① 導論與辨識','學習目標；新生兒/嬰兒/兒童年齡定義與 NRP、PBLS、PALS 適用範圍；2025 兒童生命之鏈；台美小兒 OHCA 概況；「安—叫—查—(叫)—CABD」；喚嬰兒拍腳底或擦背，不再「看聽感覺」；同時檢查脈搏與呼吸 ≤10 秒，脈搏 <60 且灌流不良就壓胸。'],
  ['② 高品質 CPR 與通氣','用力壓、快快壓、胸回彈、勿中斷；嬰兒約 4 cm、兒童約 5 cm；插管前單人 30:2、雙人 15:2，插管後每 2–3 秒一口氣；嬰兒已不建議兩指按壓法；壓額抬顎、3 歲以下墊肩成嗅吸姿勢；BVM EC 手法；胸部無起伏時 MR. SOPA。'],
  ['③ AED 與異物哽塞','小兒貼片三種位置；AED「開—貼—插—電」與電擊後立即壓胸；輕微哽塞鼓勵咳嗽；嚴重哽塞意識清楚時嬰兒拍背推胸、兒童拍背推腹；意識不清改壓胸 30 次，吹氣前目視有異物才掃除，不盲挖。'],
  ['④ 心律辨識與去顫','可電擊（VF、pVT）與不可電擊（PEA、asystole）；PEA 最常見原因低血容；PALS 心跳停止流程；2 J/kg → 4 J/kg → ≥4 J/kg（最高 10 J/kg 或成人劑量），介於刻度取高；兒童優先手動去顫器，準備電擊時不停 CPR。'],
  ['⑤ 給藥、可逆原因與 TRM','PEA/asystole 儘早 epinephrine，VF/pVT 第二次電擊後給；0.01 mg/kg（1 mg/mL 稀釋成 0.1 mg/mL 即 0.1 mL/kg），每次最多 1 mg、每 3–5 分鐘；amiodarone 5 mg/kg 第三次電擊後、最多 3 劑；院前 BVM 優先於 SGA/ETT；6H5T；TRM 閉環溝通與角色分派。']]},
 {id:'L2',kind:'lecture',name:'大堂授課　到院前小兒非創傷緊急救護流程',room:'4A019',groups:['B1-5','B6-10'],parts:[
  ['① 流程總覽與 PAT','流程骨架「ABC（小兒三角）→ 抓死人（OHCA）→ ABCDE」、T1/T2 與 TP 版本差異；PAT 外觀（肌張力、互動、眼神、哭聲）、呼吸作功、皮膚循環，接觸病童前 60 秒內、不用儀器完成；CRT 測手掌或腳底，不看指甲床。'],
  ['② 抓死人：OHCA 分支與 AED 小兒模式','無脈搏就 CPR、脈搏 <60 先正壓通氣再看、≥60 走 ABCDE；真/快/假 OHCA；CPR 深度與壓吹比；ZOLL X、ZOLL AED 3、AED PRO、Philips FR3 切小兒模式（起始 50 J）。'],
  ['③ 初評 A 與 B','兩歲以上墊枕部三軸對齊、嬰兒不需墊高；口咽呼吸道用壓舌板沿曲線直接插入，不做反向旋轉；i-gel 尺寸；2025 異物哽塞更新（一歲以上 5 背擊＋5 腹推）；面罩位置；潮氣量 6–8 mL/kg；哮吼 IH epinephrine、氣喘 MDI/Combivent。'],
  ['④ 初評 C：循環與注射','CRT/SBP/心律與 Rate-Volume-Pump，HR<60 正壓通氣、必要時 CPR；過敏不穩定 IM epinephrine 0.01 mg/kg（最多 0.3 mg，必要時每 5–10 分鐘重複）；IV 號數；IM 3 歲以下股外側肌、3 歲以上三角肌；90 度進針。'],
  ['⑤ 初評 D、E 與體重估算','AVPU、瞳孔、肌張力、血糖；50 rule 與 D10W/D25W/D50W（嬰兒 <45、其餘 <60 mg/dL）；癲癇重積 midazolam（13–40 kg 5 mg、>40 kg 10 mg）；熱痙攣 Voren 塞劑 >6 kg 半顆、>12 kg 一顆；TEN-4；體重估算（父母、Best Guess、APLS、Broselow）。']]},
 {id:'L3',kind:'lecture',name:'大堂授課　到院前小兒創傷緊急救護流程',room:'立君書房',mine:true,groups:['C1-5','C6-10'],parts:[

const SR=16000, CHUNK=30;
function wavBlob(f32s,len){
  const buf=new ArrayBuffer(44+len*2), v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+len*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,len*2,true);
  let o=44; for(const a of f32s){for(let i=0;i<a.length;i++){const s=Math.max(-1,Math.min(1,a[i]));v.setInt16(o,s<0?s*0x8000:s*0x7fff,true);o+=2}}
  return new Blob([buf],{type:'audio/wav'});
}
function downsample(input,inRate,st){
  if(inRate===SR) return new Float32Array(input);
  const ratio=inRate/SR, out=[]; let pos=st.resampPos;
  while(pos<input.length){const i0=Math.floor(pos),i1=Math.min(input.length-1,Math.floor(pos+ratio));let s=0,n=0;for(let i=i0;i<=i1;i++){s+=input[i];n++}out.push(s/n);pos+=ratio}
  st.resampPos=pos-input.length; return Float32Array.from(out);
}
const GLOSSARY='繁體中文。到院前小兒救命術 PHPLS 指導員示範教學。詞彙：PAT、小兒評估三角、XABCDE、骨針 IO、脛骨近端、脛骨粗隆、腔室症候群、外滲、胸肋凹、鼻翼搧動、囟門、會厭、CPR、AED、BVM、E-C 手法、SGA、i-gel、IM、塞劑、MDI、spacer、epinephrine、amiodarone、midazolam、Voren、TRM、MR. SOPA、NRP、PALS、PBLS、Broselow、TEN-4、IMIST、ISBAR、Debrief、4D 教學、壓吹比 15:2、30:2、J/kg、mg/kg、mL/kg、安妮。';
async function transcribeChunk(ch,onUpdate){
  for(let attempt=0;attempt<3;attempt++){
    try{
      const prev=ch.prev?.text||'';
      const fd=new FormData();
      fd.append('file',ch.blob,`seg${ch.idx}.wav`); fd.append('model',cfg.mTx); fd.append('language','zh');
      fd.append('response_format','json'); fd.append('prompt',(GLOSSARY+' '+prev.slice(-120)).slice(0,600));
      const r=await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+cfg.key},body:fd});
      const j=await r.json(); if(!r.ok) throw new Error(j.error?.message||r.status);
      ch.text=(j.text||'').trim(); ch.err=null; onUpdate(); return ch.text;
    }catch(e){ch.err=e.message; onUpdate(); await new Promise(r=>setTimeout(r,1200*(attempt+1)))}
  }
  ch.text=''; onUpdate(); return '';
}
function transcriptLines(sess){
  const items=[];
  sess.chunks.forEach(c=>items.push({t:c.start,html:c.text==null?`<span class="pending">${c.err?'重試中…':'轉錄中…'}</span>`:esc(c.text||'（無語音）'),txt:c.text||''}));
  sess.marks.forEach(m=>items.push({t:m.t,mark:1,html:`<span class="m">【評分者標記】${esc(m.label)}</span>`,txt:'【評分者現場標記】'+m.label}));
  return items.sort((a,b)=>a.t-b.t||(a.mark?1:-1));
}

- ② 互動：看有沒有提問、點學員回答、讓學員上來做、請學員互評；只問「懂嗎？」「有沒有問題？」不算真互動。
- ③ 方法：技術站看 4D（Describe→Demo→Do→Debrief）是否完整、有沒有讓學員動手與當場修正；情境站看設定→推進（暫停引導）→Debrief（感受→分析→原則）→收尾；大堂看是否只是照念投影片，還是有提問、舉例、類比、實物。
- ④ 口語、儀態與器材：錄音只能判斷口齒清晰、語速、贅詞、條理，以及口語中提到的器材操作；看不到的儀態與器材就不要據以加減分，並在 caveat 提醒評分者自行確認。
- ③ 方法中「有沒有實際示範、讓學員動手」請從口語線索判斷（例如「大家看我的手」「請你上來做一次」），不確定時在 caveat 註明。
- evidence 的 quote 直接摘逐字稿原句（≤30 字），t 用逐字稿的時間戳（m:ss）。
- phrase 要像評分單範例那樣精簡具體，例如「情境合理、抓得到 Critical error」「只問同一位學員」「有暫停引導與自評」「聲音偏小」。
- feedback 是給評分者在接下來 2 分鐘講評時直接念的：優點與建議都要具體到行為（做了什麼、造成什麼、下次怎麼調），不要說「很棒」。
- 全部用繁體中文、台灣用語。`;
  const user=`【站別】${st.name}
【${st.kind==='scenario'?'抽到教案':st.kind==='lecture'?'抽到段別':'子題'}】${p[0]}
${p[1]?'【本段教材重點】'+p[1]:''}
【本站形式】${FLOW[st.kind]}
【加分與扣分參考】${PLUS_MINUS}
【碼表時間】${fmt(sess.dur)} → ⑤ 時間控制 ${ts} 分（已定）

【逐字稿】
${lines||'（無）'}`;
  return {sys,user,ts};
}

function composeComment(rec){
  const byKey=Object.fromEntries(rec.ai.items.map(i=>[i.key,i]));
  const parts=KEYS.map(([k],n)=>`${byKey[k]?.phrase||''}（${'①②③④'[n]}${rec.scores[k]}）`);
  const d=rec.dur, tt = d>450?`${fmt(d)} 強制下台`:d<330?`${fmt(d)} 就結束`:d>420?`${fmt(d)} 超時`:d<360?`${fmt(d)} 略短`:`${fmt(d)} 收尾`;
  return parts.join('；')+`；${tt}（⑤${rec.time}）。`;
}
const total=r=>Object.values(r.scores).reduce((a,b)=>a+b,0)+r.time;

function rowText(r){const st=STATIONS.find(s=>s.id===r.station);return `${r.sid} ${r.name}｜${partShort(st.parts[r.part][0])}｜${r.scores.content} ${r.scores.interaction} ${r.scores.method} ${r.scores.delivery} ${r.time}｜${total(r)}｜${r.comment}`}
const partShort=n=>(n.match(/^[①-⑤]/)||['—'])[0];
function copy(t){navigator.clipboard?.writeText(t).then(()=>toast('已複製'),()=>{prompt('複製：',t)})}

/* ================= 評分台（A／B 兩台並排：一台評分時另一台可錄下一位） ================= */
const PANELS=[];
function claimedBy(other){ // 另一台正在錄、評分中或有未儲存結果的學員
  return other&&(other.S||other.pendingRec)?(other.S?.sid||other.pendingRec?.sid):null;
}
function makePanel(letter){
  const root=document.createElement('div'); root.className='panel'; root.dataset.p=letter;
  root.innerHTML=`
  <div class="ptitle"><b>評分台 ${letter}</b><span class="pstate">待命</span></div>
  <div class="card">
    <div class="row">
      <div><label class="f q-partLabel">抽到段別</label><select class="q-part"></select></div>
      <div><label class="f">學員</label><select class="q-student"></select></div>
    </div>
  </div>
  <div class="card rec">
    <div class="timer">0:00</div>
    <div class="zoneText">按下開始＝碼表起點（7 分鐘示範）</div>
    <div class="bar"><i class="barPin"></i><b style="left:78.6%;transform:translateX(-100%)">5:30</b><b style="left:92.85%;color:var(--ok)">6–7′</b></div>
    <button class="recBtn">開始</button>
    <div class="level"><i></i></div>
  </div>
  <div class="card">
    <div class="kicker">即時逐字稿（每 30 秒一段）</div>
    <div class="tx q-live"><p class="pending">開始錄音後，每 30 秒會出現一段逐字稿</p></div>
    <div class="row" style="margin-top:8px">
      <label class="btn sec" style="text-align:center;flex:1">上傳音檔評分<input type="file" class="q-file hidden" accept="audio/*,video/*"></label>
    </div>
  </div>
  <div class="card hidden q-prog"><div class="kicker">產生評分中</div><div class="steps"></div></div>
  <div class="hidden q-result"></div>`;
  $('#panels').appendChild(root);
  const q=s=>root.querySelector(s);
  const P={letter,root,S:null,pendingRec:null,busy:false};
  let ac,stream,proc,wakeLock,tick;
  const other=()=>PANELS.find(x=>x!==P);
  const isRecording=()=>!!(P.S&&P.S.t0);
  function setState(txt,cls){const e=q('.pstate');e.textContent=txt;root.className='panel'+(cls?' '+cls:'')}

  P.refreshSelectors=function(stationChanged){
    if(isRecording()) return;
    const s=curStation();
    if(stationChanged){
      q('.q-partLabel').textContent = s.kind==='scenario'?'抽到教案':(s.kind==='lecture'?'抽到段別':'子題');
      q('.q-part').innerHTML = s.parts.map((p,i)=>`<option value="${i}">${esc(p[0])}</option>`).join('');
    }
    const done=new Set(records.filter(r=>r.station===s.id).map(r=>r.sid));
    const o=other(); const busyOther=claimedBy(o)||(letter==='B'&&o?o.root.querySelector('.q-student').value:null);
    const ids=s.groups.flatMap(expandGroup);
    const keep=q('.q-student').value;
    q('.q-student').innerHTML=ids.map(id=>`<option value="${id}">${done.has(id)?'✓ ':id===busyOther?'◐ ':''}${id} ${esc(roster[id]||'')}</option>`).join('');
    if(!stationChanged&&keep&&ids.includes(keep)&&!done.has(keep)&&keep!==busyOther) q('.q-student').value=keep;
    else{const next=ids.find(id=>!done.has(id)&&id!==busyOther); if(next) q('.q-student').value=next;}
  };
  q('.q-student').onchange=()=>{};

  function newSession(){
    const st=curStation(), sid=q('.q-student').value;
    return {id:Date.now()+letter, station:st.id, part:+q('.q-part').value, sid, name:roster[sid]||'', chunks:[], marks:[], pcm:[], cur:[], curLen:0, total:0, t0:0, dur:0, alerts:{}, resampPos:0};
  }
  function pushPCM(S,a){S.pcm.push(a);S.cur.push(a);S.curLen+=a.length;S.total+=a.length;if(S.curLen>=SR*CHUNK) flushChunk(S)}
  function flushChunk(S,final){
    if(!S.curLen) return;
    if(final&&S.curLen<SR*0.8){S.cur=[];S.curLen=0;return}
    const idx=S.chunks.length, start=(S.total-S.curLen)/SR;
    const ch={idx,start,end:S.total/SR,text:null,err:null,blob:wavBlob(S.cur,S.curLen),prev:S.chunks[idx-1]||null};
    S.chunks.push(ch); S.cur=[]; S.curLen=0;
    ch.p=transcribeChunk(ch,()=>{if(P.S===S)renderTx()}); renderTx();
  }
  function renderTx(){
    const S=P.S; if(!S) return;
    const items=transcriptLines(S), box=q('.q-live');
    box.innerHTML=items.length?items.map(i=>`<p><span class="t">${fmt(i.t)}</span>${i.html}</p>`).join(''):'<p class="pending">錄音中，第一段逐字稿將於 0:30 出現…</p>';
    box.scrollTop=box.scrollHeight;
  }
  function lockInputs(on){['.q-part','.q-student','.q-file'].forEach(s=>q(s).disabled=on)}

  async function start(){
    if(!cfg.key){toast('請先到「設定」貼上 OpenAI API key');return}
    if(other()&&other().isRecording()){toast(`評分台 ${other().letter} 還在錄音，請先停止`);return}
    if(P.busy){toast('這一台還在產生評分，請用另一台');return}
    if(P.pendingRec&&!P.pendingRec.saved&&!confirm(`評分台 ${letter} 的 ${P.pendingRec.sid} 評分還沒儲存，要捨棄並錄下一位嗎？`)) return;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:true,channelCount:1}})}
    catch(e){toast('無法使用麥克風：'+e.message,4000);return}
    P.pendingRec=null; q('.q-result').classList.add('hidden'); q('.q-prog').classList.add('hidden');
    const S=P.S=newSession();
    ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') await ac.resume();
    const src=ac.createMediaStreamSource(stream); proc=ac.createScriptProcessor(4096,1,1);
    const mute=ac.createGain(); mute.gain.value=0; src.connect(proc); proc.connect(mute); mute.connect(ac.destination);
    proc.onaudioprocess=e=>{
      if(!S.t0) return;
      const d=e.inputBuffer.getChannelData(0); let pk=0; for(let i=0;i<d.length;i+=16){const x=Math.abs(d[i]);if(x>pk)pk=x}
      q('.level i').style.width=Math.min(100,pk*180)+'%';
      pushPCM(S,downsample(d,ac.sampleRate,S));
    };
    try{wakeLock=await navigator.wakeLock?.request('screen')}catch(e){}
    S.t0=performance.now();
    q('.recBtn').textContent='停止'; q('.recBtn').classList.add('on');
    lockInputs(true); renderTx();
    setState(`錄音中｜${S.sid} ${S.name}`,'recording'); $('#station').disabled=true;
    other()?.refreshSelectors();
    tick=setInterval(updateTimer,200);
  }
  function updateTimer(){
    const S=P.S; if(!S||!S.t0) return;
    const t=(performance.now()-S.t0)/1000; S.dur=t;
    const el=q('.timer'); el.textContent=fmt(t);
    let z=0,txt;
    if(t>=330&&t<360){z=1;txt='5:30 過了——再撐一下到 6:00'} else if(t>=360&&t<=420){z=2;txt='✅ 滿分區間 6:00–7:00'}
    else if(t>420&&t<=450){z=3;txt='⚠️ 超過 7:00（得 2 分）'} else if(t>450){z=4;txt='⛔ 超過 7:30 → 強制下台'}
    else txt=t<60?'Describe／設定':'進行中（<5:30 結束只得 1 分）';
    el.className='timer z'+z; q('.zoneText').textContent=txt;
    q('.barPin').style.left=Math.min(100,t/420*100)+'%';
    for(const [sec,msg] of [[360,'6:00：剩 1 分鐘，請給提示'],[420,'7:00'],[450,'7:30 強制下台']]){
      if(t>=sec&&!S.alerts[sec]){S.alerts[sec]=1;alertCue(msg)}
    }
  }
  function alertCue(msg){
    toast(`評分台 ${letter}｜${msg}`,3500); navigator.vibrate?.([200,100,200]);
    const r=q('.rec'); r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash');
    if(cfg.beep&&ac){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.25)}
  }
  async function stop(){
    const S=P.S; clearInterval(tick);
    S.dur=(performance.now()-S.t0)/1000; updateTimer();
    proc.onaudioprocess=null; try{proc.disconnect()}catch(e){}
    stream.getTracks().forEach(t=>t.stop()); try{await ac.close()}catch(e){}
    try{wakeLock&&await wakeLock.release()}catch(e){}

      const tmp=new (window.AudioContext||window.webkitAudioContext)();
      const ab=await tmp.decodeAudioData(await f.arrayBuffer()); tmp.close();
      const off=new OfflineAudioContext(1,Math.ceil(ab.duration*SR),SR);
      const src=off.createBufferSource(); src.buffer=ab; src.connect(off.destination); src.start();
      const d=(await off.startRendering()).getChannelData(0);
      P.pendingRec=null; q('.q-result').classList.add('hidden');
      const S=P.S=newSession();
      for(let i=0;i<d.length;i+=SR*CHUNK) pushPCM(S,d.slice(i,Math.min(d.length,i+SR*CHUNK)));

  function step(id,txt,state){

        response_format:{type:'json_schema',json_schema:{name:'phpls_eval',strict:true,schema:SCHEMA}}};
      if(/^(gpt-5|o\d)/.test(cfg.mScore)) body.reasoning_effort='low';

        </div>`}).join('')}
        <div class="item"><h4><span>⑤ 時間控制</span><span class="seg" data-k="time">${[1,2,3].map(n=>`<button class="${rec.time===n?'on':''}" data-n="${n}">${n}</button>`).join('')}</span></h4>
          <div class="why">碼表 <input type="text" class="q-dur" value="${fmt(rec.dur)}" style="width:80px;padding:4px 6px;display:inline-block"> <span class="ai">改時間會自動重算</span></div></div>

    });
    q('.q-dur').onchange=e=>{const m=e.target.value.match(/(\d+)[:：](\d{1,2})/);if(!m)return;rec.dur=+m[1]*60+ +m[2];rec.time=timeScore(rec.dur);
      box.querySelectorAll('.seg[data-k=time] button').forEach(x=>x.classList.toggle('on',+x.dataset.n===rec.time)); upd()};
    box.onclick=e=>{const t=e.target.closest('.t');if(!t)return;const p=q('.q-player');if(!p)return;const m=String(t.dataset.t).match(/(\d+):(\d+)/);if(m){p.currentTime=+m[1]*60+ +m[2];p.play()}};
    q('.q-copy').onclick=()=>{rec.comment=q('.q-comment').value;copy(rowText(rec))};
    q('.q-save').onclick=()=>{
      rec.comment=q('.q-comment').value; rec.saved=true;
      const i=records.findIndex(r=>r.id===rec.id); if(i>=0) records[i]=rec; else records.push(rec);
      LS.set('records',records); toast(`已儲存 ${rec.sid}｜${total(rec)} 分`);
      P.reset(); PANELS.forEach(p=>p.refreshSelectors()); renderHist();
    };
  };
  P.reset=function(){
    P.S=null; P.pendingRec=null; P.busy=false;
    q('.timer').textContent='0:00'; q('.timer').className='timer'; q('.zoneText').textContent='按下開始＝碼表起點（7 分鐘示範）';
    q('.barPin').style.left='0';
    q('.q-live').innerHTML='<p class="pending">開始錄音後，每 30 秒會出現一段逐字稿</p>';
    q('.q-prog').classList.add('hidden'); q('.q-result').classList.add('hidden'); q('.q-result').innerHTML='';
    setState('待命','');
  };
  P.idle=()=>!isRecording()&&!P.busy&&!(P.pendingRec&&!P.pendingRec.saved);
  PANELS.push(P); return P;
}
window.addEventListener('beforeunload',e=>{if(PANELS.some(p=>p.isRecording()||p.busy||(p.pendingRec&&!p.pendingRec.saved))){e.preventDefault();e.returnValue=''}});

/* ================= 紀錄 ================= */
function renderHist(sync){
  const f=$('#histFilter'); const cur=(sync||!f.value)?$('#station').value:f.value;
  f.innerHTML=`<option value="all">全部站別（${records.length}）</option>`+STATIONS.map(s=>{const n=records.filter(r=>r.station===s.id).length;return `<option value="${s.id}">${esc(s.name.replace('　','｜'))}（${n}）</option>`}).join('');
  f.value=cur;
  const rows=records.filter(r=>f.value==='all'||r.station===f.value).sort((a,b)=>a.sid.localeCompare(b.sid,'en',{numeric:true}));
  $('#histTable').innerHTML=`<tr><th>學員</th><th>段</th><th>①</th><th>②</th><th>③</th><th>④</th><th>⑤</th><th>總</th><th>評語</th><th></th></tr>`+
    rows.map(r=>{const st=STATIONS.find(s=>s.id===r.station);return `<tr><td>${esc(r.sid)}<br>${esc(r.name)}</td><td>${esc(partShort(st.parts[r.part][0]))}</td>
      <td class="n">${r.scores.content}</td><td class="n">${r.scores.interaction}</td><td class="n">${r.scores.method}</td><td class="n">${r.scores.delivery}</td><td class="n">${r.time}</td>
      <td class="n"><b>${total(r)}</b></td><td style="font-size:13px">${esc(r.comment)}</td><td><button class="btn sec" style="padding:4px 8px;font-size:13px" data-open="${r.id}">看</button></td></tr>`}).join('');
}
$('#histFilter').onchange=renderHist;
$('#histTable').onclick=e=>{const b=e.target.closest('[data-open]');if(!b)return;const r=records.find(x=>x.id==b.dataset.open);const p=PANELS.find(p=>p.idle());if(!p){toast('兩台都在使用中');return}showTab('rec');p.reset();p.showResult(r,null);p.root.scrollIntoView({behavior:'smooth'})};
$('#copyAllBtn').onclick=()=>{const f=$('#histFilter').value;copy(records.filter(r=>f==='all'||r.station===f).sort((a,b)=>a.sid.localeCompare(b.sid,'en',{numeric:true})).map(rowText).join('\n'))};
$('#csvBtn').onclick=()=>{
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const lines=[['站別','段別/教案','編號','姓名','內容','互動','方法','口語','時間','總分','碼表','評語','評分者','時間戳'].map(q).join(',')]
    .concat(records.map(r=>{const st=STATIONS.find(s=>s.id===r.station);return [st.name,st.parts[r.part][0],r.sid,r.name,r.scores.content,r.scores.interaction,r.scores.method,r.scores.delivery,r.time,total(r),fmt(r.dur),r.comment,r.rater,r.ts].map(q).join(',')}));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));a.download='PHPLS示範教學評分.csv';a.click();
};

makePanel('A'); makePanel('B');
fillStations(); showTab('rec');
</script>
</body>
</html>
